name: BuffettValue WSL acceptance
on:
  push:
    branches: [feature/v1-local-dcf-cli]
    paths: ['.github/workflows/wsl-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify WSL and test isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          grep -qi microsoft /proc/sys/kernel/osrelease
          python3 -m unittest discover -s tests -v
          python3 -m buffettvalue --input examples/dcf-example.json
      - name: Verify shared MKD access without writes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:8100/health/live
          PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=15000' psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -p 5433 -d market_data_hub -c "SELECT currency, quality_status, count(*) FROM public.eod_bars WHERE currency IN ('EUR','USD') GROUP BY currency, quality_status"
      - name: Verify actual MKD observation client
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          export SAMPLE=$(psql -XAt -F '|' -h /var/run/postgresql -p 5433 -d market_data_hub -v ON_ERROR_STOP=1 -c "SELECT i.instrument_id,i.symbol,i.mic,i.currency,b.session_date FROM instrument_identifiers i JOIN eod_bars b ON b.instrument_id=i.instrument_id AND b.currency=i.currency WHERE i.provider='yahoo' AND i.valid_to IS NULL AND i.currency IN ('EUR','USD') AND b.provider='yahoo' AND b.quality_status='staged_unverified' AND b.session_date<b.first_available_at::date ORDER BY b.session_date DESC LIMIT 1")
          test -n "$SAMPLE"
          python3 - <<'PY'
          import os
          from datetime import date,datetime,timezone
          from buffettvalue.mkd_observations import observed_history
          iid,symbol,mic,currency,day=os.environ['SAMPLE'].split('|')
          doc=observed_history(iid,currency=currency,start=date.fromisoformat(day),end=date.fromisoformat(day),as_of=datetime.now(timezone.utc))
          assert doc['items'] and doc['paper_eligible'] is False
          print('MKD_CLIENT_PASS',symbol,day)
          PY
          IFS='|' read -r iid symbol mic currency day <<< "$SAMPLE"
          python3 -m buffettvalue --input examples/dcf-example.json --mkd-instrument "$iid" --currency "$currency" > /tmp/buffett-dcf-$GITHUB_RUN_ID.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["price_source"]=="MKD_OBSERVED" and d["paper_eligible"] is False; print(d)' /tmp/buffett-dcf-$GITHUB_RUN_ID.json
